[project]
name = "siyona"
version = "0.1.0"
description = "WhatsApp-based agentic AI voice assistant that places real outbound calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "services/whatsapp-gateway",
    "services/voice-agent",
    "services/orchestrator",
    "services/api",
    "eval",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", "infra/terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
