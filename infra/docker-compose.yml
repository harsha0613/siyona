name: siyona

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siyona
      POSTGRES_PASSWORD: siyona
      POSTGRES_DB: siyona
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siyona"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  whatsapp-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn webhook:app --host 0.0.0.0 --port 8000
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orchestrator:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python -c "import state_machine; print('orchestrator ready')"
    env_file:
      - ../.env.example
    depends_on:
      - redis

  voice-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    command: python services/voice-agent/pipeline.py
    env_file:
      - ../.env.example
    depends_on:
      - redis

volumes:
  pgdata:
